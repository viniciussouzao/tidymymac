name: Build and Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-src/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "site-src/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages-production' || format('pages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and test landing page
        run: npm run site:test

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          page="$(curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors "$base_url/")"
          grep -Fq '<title>TidyMyMac — macOS Storage Cleanup Tool</title>' <<<"$page" || {
            echo "Expected landing-page title was not found at $base_url/" >&2
            exit 1
          }
          for asset in \
            assets/site.css \
            assets/site.js \
            assets/logo.png \
            assets/tui-demo-poster.webp \
            assets/cli-demo-poster.webp \
            assets/tui-demo.mp4 \
            assets/cli-demo.mp4
          do
            curl --fail --silent --show-error --location --output /dev/null \
              --retry 6 --retry-delay 5 --retry-all-errors "$base_url/$asset" || {
              echo "Deployed asset is unavailable: $base_url/$asset" >&2
              exit 1
            }
          done
