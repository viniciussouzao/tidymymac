name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }} --force

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install deps
        run: go mod download

      - name: Build darwin/amd64
        run: |
          GOOS=darwin GOARCH=amd64 go build \
            -ldflags="-X github.com/viniciussouzao/tidymymac/internal/buildinfo.Version=${{ steps.version.outputs.version }} \
                      -X github.com/viniciussouzao/tidymymac/internal/buildinfo.Commit=${{ github.sha }} \
                      -X github.com/viniciussouzao/tidymymac/internal/buildinfo.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/tidymymac-darwin-amd64 \
            ./cmd/tidymymac/

      - name: Build darwin/arm64
        run: |
          GOOS=darwin GOARCH=arm64 go build \
            -ldflags="-X github.com/viniciussouzao/tidymymac/internal/buildinfo.Version=${{ steps.version.outputs.version }} \
                      -X github.com/viniciussouzao/tidymymac/internal/buildinfo.Commit=${{ github.sha }} \
                      -X github.com/viniciussouzao/tidymymac/internal/buildinfo.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/tidymymac-darwin-arm64 \
            ./cmd/tidymymac/

      - name: Package binaries
        run: |
          cd dist
          tar -czf tidymymac-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz tidymymac-darwin-amd64
          tar -czf tidymymac-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz tidymymac-darwin-arm64
          rm tidymymac-darwin-amd64 tidymymac-darwin-arm64

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 *.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          make_latest: true

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: viniciussouzao/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: homebrew-tap
        run: |
          FORMULA_VERSION="${VERSION#v}"
          ARM_URL="https://github.com/viniciussouzao/tidymymac/releases/download/${VERSION}/tidymymac-${VERSION}-darwin-arm64.tar.gz"
          AMD_URL="https://github.com/viniciussouzao/tidymymac/releases/download/${VERSION}/tidymymac-${VERSION}-darwin-amd64.tar.gz"

          ARM_SHA=$(curl --fail --location --silent --show-error "$ARM_URL" | shasum -a 256 | awk '{print $1}')
          AMD_SHA=$(curl --fail --location --silent --show-error "$AMD_URL" | shasum -a 256 | awk '{print $1}')

          ruby - "$FORMULA_VERSION" "$VERSION" "$ARM_SHA" "$AMD_SHA" <<'RUBY'
          version, tag, arm_sha, amd_sha = ARGV
          path = "Formula/tidymymac.rb"
          formula = File.read(path)

          formula.sub!(/^  version ".*"$/, %(  version "#{version}"))
          formula.sub!(/(on_arm do.*?sha256 ")[^"]+(")/m, "\\1#{arm_sha}\\2")
          formula.sub!(/(on_intel do.*?sha256 ")[^"]+(")/m, "\\1#{amd_sha}\\2")
          formula.gsub!(
            %r{releases/download/[^/]+/tidymymac-[^"]+-darwin-},
            "releases/download/#{tag}/tidymymac-#{tag}-darwin-"
          )

          File.write(path, formula)
          RUBY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- Formula/tidymymac.rb; then
            git add Formula/tidymymac.rb
            git commit -m "Update tidymymac formula to ${VERSION}"
            git push origin main
          fi
