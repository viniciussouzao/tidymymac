name: Shellcheck

on:
  push:
    branches: ["main"]
    paths: ["install.sh", ".github/workflows/shellcheck.yml"]
  pull_request:
    branches: ["main"]
    paths: ["install.sh", ".github/workflows/shellcheck.yml"]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh install.sh
